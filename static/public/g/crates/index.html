        <script type>
            class Vec {
                constructor(x = 0, y = 0, z = 0) {
                    this.x = Number(x)
                    this.y = Number(y)
                    this.z = Number(z)
                } // Constructor. Z is completely optional always.
                
                add(v) {
                    return this.set(Vec.add(this, ...arguments))
                };
                sub(v) {
                    return this.set(Vec.sub(this, ...arguments))
                }
                mult(v) {
                    return this.set(Vec.mult(this, ...arguments))
                }
                div(v) {
                    return this.set(Vec.div(this, ...arguments))
                }
                invert() {
                    return this.set(Vec.invert(this))
                }
                dot(v) {
                    return Vec.dot(this, v)
                }
                cross(v) {
                    return Vec.cross(this, v)
                } // Doesn't change
                magSq() {
                    return Vec.magSq(this)
                }
                mag() {
                    return Vec.mag(this)
                }
                norm() {
                    return this.set(Vec.norm(this))
                }
                setMag(mag) {
                    return this.set(Vec.setMag(this, mag))
                }
                limit(mag) {
                    return this.set(Vec.limit(this, mag))
                }
                axisRot(axis, theta) {
                    return this.set(Vec.axisRot(this, axis, theta))
                }
                rotate2D(theta) {
                    return this.set(Vec.rotate2D(this, theta))
                }
                lerp(v, amount) {
                    return this.set(Vec.lerp(this, v, amount))
                } // Changes
                distSq(v) {
                    return Vec.distSq(this, v)
                }
                dist(v) {
                    return Vec.dist(this, v)
                }
                isEqual(v) {
                    return Vec.isEqual(this, v)
                }
                round() {
                    return this.set(Vec.round(this))
                }
                
                set(v) {
                    if(v instanceof Vec) {
                        this.x = v.x
                        this.y = v.y
                        this.z = v.z
                    } else if(typeof v === "number") {
                        this.x = arguments[0] ?? this.x
                        this.y = arguments[1] ?? this.y
                        this.z = arguments[2] ?? this.z
                    }
                    
                    return this
                } // Sets the vector to 'v', or 1 - 3 numbers. Omitted numbers will default to the original numbers.
                clone() {
                    return new Vec(this.x, this.y, this.z);
                } // Returns a clone of the vector.
                asP5() {
                    return Vec.asP5(this)
                }
                
                // The static functions will NEVER change the original, only returning the new Vec.
                static add(v1, v2) {
                    if(v2 instanceof Vec) {
                        return new Vec(v1.x+v2.x, v1.y+v2.y, v1.z+v2.z)
                    } else if(typeof v2 === "number") {
                        return new Vec(v1.x+arguments[1] ?? 0, v1.y+arguments[2] ?? 0, v1.z+arguments[3] ?? 0)
                    }
                } // Adds two vectors or a vector and 1 - 3 numbers.
                static sub(v1, v2) {
                    if(v2 instanceof Vec) {
                        return new Vec(v1.x-v2.x, v1.y-v2.y, v1.z-v2.z)
                    } else if(typeof v2 === "number") {
                        return new Vec(v1.x-arguments[1] ?? 0, v1.y-arguments[2] ?? 0, v1.z-arguments[3] ?? 0)
                    }
                } // Subtracts two vectors or a vector and 1 - 3 numbers.
                static mult(v1, v2) {
                    if(v2 instanceof Vec) {
                        return new Vec(v1.x*v2.x, v1.y*v2.y, v1.z*v2.z)
                    } else if(typeof v2 === "number") {
                        return new Vec(v1.x*v2, v1.y*v2, v1.z*v2)
                    }
                } // Multiplies two vectors or a vector and a number.
                static div(v1, v2) {
                    if(v2 instanceof Vec) {
                        return new Vec(v1.x/v2.x, v1.y/v2.y, v1.z/v2.z)
                    } else if(typeof v2 === "number") {
                        return new Vec(v1.x/v2, v1.y/v2, v1.z/v2)
                    }
                } // Divides two vectors or a vector and a number.
                static invert(v) {
                    return new Vec(-v.x, -v.y, -v.z)
                } // Negates a vector.
                static dot(v1, v2) {
                    return v1.x*v2.x + v1.y*v2.y + v1.z*v2.z
                } // Vector dot product.
                static cross(v1, v2) {
                    return new Vec(v1.y * v2.z - v2.y * v1.z, v1.z * v2.x - v2.z * v1.x, v1.x * v2.y - v2.x * v1.y)
                } // Vector cross product.
                static magSq(v) {
                    return v.x*v.x + v.y*v.y + v.x*v.z
                } // Magnitude squared.
                static mag(v) {
                    return sqrt(Vec.magSq(v))
                } // Magnitude.
                static norm(v) {
                    return v.clone().div(v.clone().mag())
                } // Normalize a vector.
                static setMag(v, mag) {
                    return v.clone().norm().mult(mag)
                } // Set the magnitude of a vector.
                static limit(v, mag) {
                    if(v.mag() > mag) {
                        return v.clone().setMag(mag)
                    } else {
                        return v.clone()
                    }
                } // Limit a vector's magnitude to a number.
                static axisRot(v, axis, theta) {
                    var ca = Math.cos(theta), sa = Math.sin(theta), t=1-ca, x=axis.x, y=axis.y, z=axis.z, before=v.clone()
                    return new Vec(new Vec(ca + x*x*t, x*y*t - z*sa, x*z*t + y*sa).dot(before), new Vec(x*y*t + z*sa, ca + y*y*t, y*z*t - x*sa).dot(before), new Vec(z*x*t - y*sa, z*y*t + x*sa, ca + z*z*t).dot(before))
                } // Rotate a vector around an axis vector by theta. Useful in 3D.
                static rotate2D(v, theta) {
                    return Vec.axisRot(v, new Vec(0, 0, 1), theta)
                } // Rotate a vector in 2D by theta. The vector axis in 2D are x and y.
                static lerp(v1, v2, amount) {
                    let lerp = (a, b, amnt) => a+(b-a)*amnt
                    return new Vec(lerp(v1.x, v2.x, amount), lerp(v1.y, v2.y, amount), lerp(v1.z, v2.z, amount))
                } // Lerp two vectors.
                static distSq(v1, v2) {
                    return Math.pow(v2.x-v1.x, 2) + Math.pow(v2.y-v1.y, 2) + Math.pow(v2.z-v1.z, 2)
                } // Distance squared between two vectors.
                static dist(v1, v2) {
                    return Math.sqrt(Vec.distSq(v1, v2))
                } // Distance between two vectors.
                static asP5(v) {
                    return new p5.Vector(v.x, v.y, v.z)
                }
                static isEqual(v1, v2) {
                    return v1.x===v2.x&&v1.y===v2.y&&v1.z===v2.z
                }
                static round(v) {
                    return new Vec(round(v.x), round(v.y), round(v.z))
                }
                
                toString() {
                    return "Vec: ("+this.x+", "+this.y+", "+this.z+")"
                } // Custom toString.
            }

            var loader;
            var world;
            var foregroundCtx; // Spriteloader, world, and the foreground drawing context
            function setup() {
                createCanvas(600, 600, WEBGL) // Create the 3D canvas
                setAttributes({ antialias: false })
                
                foregroundCtx = $("#foregroundCanvas")[0].getContext("2d") // Create the drawing context
                
                frameRate(300) // Load really fast.
                
                loader = new PixelArtLoader(src, images) // Create the loader
                levels[level].createWorld() // Create the world
            }
            
            function runGame() {
                world.update() // Update the world
                for(var x = 0; x < world.width; x++) {
                    for(var y = 0; y < world.height; y++) {
                        noStroke()
                        push()
                        translate(Vec.mult(new Vec(x, 0, y), BLOCK_SIZE).add(new Vec(0, BLOCK_SIZE*3/2)).asP5())
                        rotateX(Math.PI/2)
                        texture(images.basic)
                        plane(BLOCK_SIZE)
                        pop()
                    }
                } // Draw blank spots.
            }
        
            function draw() {
                loader.load(
                   () => { // callback
                    frameRate(60)
                    $("#loadText").fadeOut()
                }, () => { // main draw
                    if(won) {
                        winScene(foregroundCtx)
                    } else {
                        rotateX(-Math.PI/2+0.5)
                        translate(world.player.vPos.clone().invert().asP5()) // Camera
                        background(200) // Reset background
                        runGame() // Run game
                        
                        if(!won) {
                            foregroundCtx.reset()
                            foregroundCtx.fillStyle = "black"
                            foregroundCtx.strokeStyle = "white"
                            foregroundCtx.lineWidth = 2
                            foregroundCtx.font = "20px arial"
                            foregroundCtx.textAlign = "center"
                            foregroundCtx.strokeText(`Level ${level+1}: ${levels[level].name}`, 300, 50)
                            foregroundCtx.fillText(`Level ${level+1}: ${levels[level].name}`, 300, 50) // Draw the 'Level X: XXXX' text
                        }
                    }
                }, () => { // draw if loading not done
                    $("#loadNumber").text(`${loader.index}/${Object.keys(src).length}`) // Update the loading text.
                })
                
                keysR = {} // Reset the keys released
            }
